<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions dashboard</title>
<link rel="icon" id="fav" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232f6bff'/><stop offset='1' stop-color='%2314b8a6'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><g fill='white'><rect x='9' y='14' width='12' height='10' rx='3'/><rect x='9' y='27' width='12' height='10' rx='3'/><rect x='9' y='40' width='12' height='10' rx='3'/><rect x='26' y='14' width='12' height='10' rx='3'/><rect x='26' y='27' width='12' height='10' rx='3'/><rect x='43' y='14' width='12' height='10' rx='3' opacity='.9'/></g></svg>">
<style>
:root{
  --bg:#f2f5fa;--card:#fff;--ink:#14213d;--mute:#5b6b86;--line:#dbe2ee;--chip:#e9eef7;
  --hdr:#0b1f3a;--hdr-ink:#e8eefb;--hdr-mute:#9fb2d0;
  --busy:#1d5fd1;--wait:#b8660a;--idle:#66768d;--ok:#1b7a4b;--hot:#b42318;--cold:#3b7ea1;
  --s-review:#5b4bc4;--s-analysis:#0f7bb8;--s-po:#a23b72;--s-dev:#c2650c;--s-cr:#0f7f78;--s-done:#1b7a4b;--s-none:#5b6b86;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 2px 8px rgba(11,31,58,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1422;--card:#142033;--ink:#e6ecf7;--mute:#97a8c2;--line:#24324b;--chip:#1c2a42;
  --hdr:#08101e;--hdr-ink:#e6ecf7;--hdr-mute:#8da0bd;
  --busy:#6aa3ff;--wait:#f0a63a;--idle:#8c9cb5;--ok:#4cc38a;--hot:#ff7b6e;--cold:#7cc0e3;
  --s-review:#9a8cf2;--s-analysis:#4db3ea;--s-po:#e07db0;--s-dev:#f0903a;--s-cr:#3fc4bb;--s-done:#4cc38a;--s-none:#97a8c2;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0c1422;--card:#142033;--ink:#e6ecf7;--mute:#97a8c2;--line:#24324b;--chip:#1c2a42;
  --hdr:#08101e;--hdr-ink:#e6ecf7;--hdr-mute:#8da0bd;
  --busy:#6aa3ff;--wait:#f0a63a;--idle:#8c9cb5;--ok:#4cc38a;--hot:#ff7b6e;--cold:#7cc0e3;
  --s-review:#9a8cf2;--s-analysis:#4db3ea;--s-po:#e07db0;--s-dev:#f0903a;--s-cr:#3fc4bb;--s-done:#4cc38a;--s-none:#97a8c2;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25);
}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
a{color:inherit}
.mute{color:var(--mute)}.sp{flex:1}

/* ---------- header ---------- */
header{display:flex;gap:14px;align-items:center;padding:9px 20px;background:var(--hdr);color:var(--hdr-ink);position:sticky;top:0;z-index:5;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand .logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2f6bff,#14b8a6);color:#fff;font-size:16px}
nav{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
nav button{border:0;background:none;color:var(--hdr-mute);font:inherit;font-weight:600;padding:5px 13px;border-radius:7px;cursor:pointer}
nav button.on{background:rgba(255,255,255,.16);color:#fff}
header .mute{color:var(--hdr-mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);color:var(--hdr-ink)}
.pill.wait{background:#f0a63a;color:#2a1700}
#wx{gap:6px}
header button.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--hdr-ink);border-radius:99px;padding:3px 11px;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
header button.tg:hover{background:rgba(255,255,255,.1)}
header button.tg.off{border-style:dashed;color:var(--hdr-mute)}
.cnt{display:inline-block;min-width:19px;text-align:center;border-radius:99px;padding:0 6px;background:#f0a63a;color:#2a1700;font-weight:800;font-size:11px}
.cnt.zero{background:#2fb577;color:#04200f}
header button.tg.off .cnt:not(.zero){animation:ring 1.6s ease-in-out infinite}

/* ---------- layout ---------- */
.layout{display:flex;align-items:flex-start}
main{flex:1;min-width:0;padding:16px 20px}
aside{flex:0 0 304px;position:sticky;top:52px;max-height:calc(100vh - 56px);overflow:auto;padding:16px 16px 16px 0}
.nosd aside{display:none}
@media (max-width:1100px){aside{display:none}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:0 0 10px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--mute);font-size:12px;padding:6px 4px}

/* ---------- stations ---------- */
.track{display:flex;align-items:stretch;overflow-x:auto;padding:2px 2px 12px}
.stn{flex:1 1 0;max-width:340px;min-width:190px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;border-top:3px solid var(--c);padding-bottom:6px}
.stn h2,.rvh{margin:0;display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--c) 9%,var(--card))}
.stn h2 svg,.rvh svg{color:var(--c);font-size:16px}
.n{margin-left:auto;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border-radius:99px;padding:0 9px;font-size:12px;font-weight:800}
.stn .body{padding:8px 8px 0}
.arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--mute);opacity:.6;font-size:16px}
.rvlane{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;background:var(--card);margin:0 0 12px;overflow:hidden;box-shadow:var(--shadow)}
.rvh .hint{margin-left:auto;color:var(--mute);font-size:11px;font-weight:500}
.rvh .n{margin-left:6px}
.rvrow{display:flex;gap:8px;overflow-x:auto;padding:8px;align-items:stretch}
.rvrow .tok{flex:0 0 255px;margin:0}

/* ---------- cards ---------- */
.tok{--sc:var(--idle);position:relative;border-radius:10px;padding:6px 9px 6px 13px;margin-bottom:6px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 1px rgba(11,31,58,.04)}
.tok::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.tok.busy{--sc:var(--busy);background:color-mix(in srgb,var(--busy) 6%,var(--card))}
.tok.waiting{--sc:var(--wait);background:color-mix(in srgb,var(--wait) 11%,var(--card));border-color:color-mix(in srgb,var(--wait) 55%,var(--line));animation:pulse 1.8s ease-in-out infinite}
.tok.idle{--sc:var(--idle)}
.tok.closed{--sc:var(--idle);opacity:.6}
.tok.prdone{--sc:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.tok.fx-knock3{animation:pulse .9s ease-in-out infinite;border-color:var(--hot)}
.row{display:flex;gap:8px;align-items:flex-start}.cont{flex:1;min-width:0}
.av{--tn:var(--idle);position:relative;display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--tn) 14%,transparent);color:var(--tn);font-size:16px;cursor:pointer;user-select:none}
.av.ok{--tn:var(--ok)}.av.wait{--tn:var(--wait)}.av.busy{--tn:var(--busy)}.av.hot{--tn:var(--hot)}.av.cold{--tn:var(--cold)}.av.idle{--tn:var(--idle)}
.tok .t{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tok .t a{font-weight:700;color:var(--busy);text-decoration:none}.tok .t a:hover{text-decoration:underline}
.bub{display:block;width:fit-content;max-width:100%;font-size:11px;font-style:italic;color:var(--mute);margin:2px 0 0;padding:1px 8px;border-radius:9px 9px 9px 2px;background:var(--chip);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .m{display:flex;align-items:center;flex-wrap:wrap;gap:5px;row-gap:3px;margin-top:4px;font-size:11px;color:var(--mute);white-space:nowrap}
.badge{font-weight:700;font-size:10px;letter-spacing:.2px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc);white-space:nowrap;line-height:1.7}
.age{width:8px;height:8px;border-radius:50%;background:var(--ag);display:inline-block}
.btn,.open,.rf,.mv{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:11px;font-weight:600;line-height:1.5;padding:1px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.open{margin-left:auto}
.open:hover,.rf:hover{background:var(--chip)}
.rf.pend{opacity:.65;cursor:default}
.mv{width:100%;justify-content:center;margin-top:5px;padding:4px 8px;font-size:12px;border-color:transparent;background:var(--ok);color:#fff}
.mv:hover{filter:brightness(1.08)}
.mv.ar{background:var(--idle)}
.mv:disabled{opacity:.6;cursor:default}
.zzz{position:absolute;top:-5px;right:-6px;font-size:9px;font-weight:700;font-style:normal;color:var(--cold);animation:zz 2.6s ease-in infinite}
.dots{position:absolute;top:-3px;right:-5px}
.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--busy);margin:0 1px;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.fx-knock1 .av svg{animation:k1 3s infinite;transform-origin:50% 10%}.fx-knock2 .av svg{animation:k2 2s infinite;transform-origin:50% 10%}.fx-knock3 .av svg{animation:k3 .5s infinite;transform-origin:50% 10%}
.fx-typing .av svg{animation:spin 2.6s linear infinite}
.fx-sleep .av{opacity:.85}
.fx-party .av svg{animation:shine 2.4s ease-in-out infinite}
.pat{animation:pat .5s}
.heart{position:absolute;left:50%;top:-4px;font-size:11px;font-weight:800;color:var(--ok);animation:up 1s forwards;pointer-events:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;bottom:2px;width:6px;height:9px;border-radius:2px;animation:cf 1.6s ease-out forwards}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 32%,transparent)}}
@keyframes ring{50%{box-shadow:0 0 0 4px rgba(240,166,58,.45)}}
@keyframes k1{0%,88%,100%{transform:none}92%{transform:rotate(-14deg)}96%{transform:rotate(14deg)}}
@keyframes k2{0%,70%,100%{transform:none}74%,82%{transform:rotate(-16deg)}78%,86%{transform:rotate(16deg)}90%{transform:none}}
@keyframes k3{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{50%{transform:scale(1.18)}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-3px);opacity:1}}
@keyframes zz{0%{transform:translateY(5px);opacity:0}30%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
@keyframes pat{50%{transform:scale(1.25)}}
@keyframes up{to{transform:translateY(-24px);opacity:0}}
@keyframes cf{from{transform:translateY(0)}to{transform:translateY(-70px) rotate(220deg);opacity:0}}
.calm *,.calm *::before,.calm *::after{animation:none!important}

/* ---------- sidebar ---------- */
.sbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.sbox>h2{margin:0;padding:9px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;background:var(--chip)}
.sbox>h2 .cnt{margin-left:auto}
.sg{padding:6px 10px 2px}
.sg h3{margin:6px 0 5px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:700}
.si{border:1px solid var(--line);border-left:4px solid var(--c,var(--idle));border-radius:8px;padding:5px 8px;margin-bottom:6px;background:var(--card)}
.si .sh{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .sh a{font-weight:700;color:var(--busy);text-decoration:none}
.si .sr{font-size:11px;color:var(--mute);margin:1px 0 4px;display:flex;gap:5px;align-items:center}
.si .sb{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.si .sb .mv{margin:0;width:auto;padding:2px 10px}
.si .sb .open{margin-left:0}
.si.claude{--c:var(--s-review)}.si.need{--c:var(--wait)}.si.merge,.si.close{--c:var(--ok)}
.sempty{padding:16px 12px;text-align:center;color:var(--mute);font-size:13px}
.sempty svg{display:block;margin:0 auto 6px;font-size:26px;color:var(--ok)}

/* ---------- week ---------- */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer;font:inherit;font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left;white-space:normal}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700;background:var(--chip)}
tbody tr:hover td{background:color-mix(in srgb,var(--busy) 5%,var(--card))}
td a{color:var(--busy)}
tr.tot td{font-weight:800;background:var(--chip);border-bottom:0}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:1px 7px;margin:1px 3px 1px 0;font-size:11px;font-weight:600}
.st-open{color:var(--wait);font-weight:700}.st-deleted{color:var(--ok);font-weight:700}
.stn .tok .open .lbl{display:none}.stn .tok .open{padding:1px 6px}
.addrv{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:8px;border-radius:7px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--card);color:var(--c);cursor:pointer;font-size:15px;padding:0}
.addrv:hover{background:var(--c);color:#fff}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(380px,92vw)}
dialog::backdrop{background:rgba(8,16,30,.55)}
dialog form{padding:18px 20px}
dialog h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
dialog p{margin:0 0 12px;color:var(--mute);font-size:12.5px}
dialog input{width:100%;font:inherit;font-size:16px;font-weight:700;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);letter-spacing:.5px}
dialog input:focus{outline:2px solid var(--busy);border-color:transparent}
dialog .err{color:var(--hot);font-size:12px;min-height:16px;margin-top:6px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
dialog .acts button{font:inherit;font-weight:700;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
dialog .acts button.go{background:var(--s-review);border-color:transparent;color:#fff}
dialog .acts button:hover{filter:brightness(1.08)}
.av.news{--tn:var(--s-analysis)}
.tok.news{--sc:var(--s-analysis);background:color-mix(in srgb,var(--s-analysis) 8%,var(--card));border-color:color-mix(in srgb,var(--s-analysis) 40%,var(--line))}
.si.news{--c:var(--s-analysis)}
.si .sr{align-items:flex-start;line-height:1.3}.si .sr span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill.news{background:var(--s-analysis);color:#fff}
/* ---- unread cards: loud on purpose ---- */
.tok.news{border:1px solid var(--s-analysis);background:color-mix(in srgb,var(--s-analysis) 13%,var(--card));animation:newsglow 1.7s ease-in-out infinite}
.tok.news::before{width:7px;background:var(--s-analysis)}
.tok.news::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--s-analysis);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-analysis) 30%,transparent);animation:newsdot 1.4s ease-in-out infinite}
.tok.news .t{font-weight:700}
.tok.news .badge{background:var(--s-analysis);color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--s-analysis) 30%,transparent)}
.fx-news .av{box-shadow:0 0 0 2px var(--s-analysis);background:color-mix(in srgb,var(--s-analysis) 22%,transparent)}
.fx-news .av svg{animation:newsb 1.3s ease-in-out infinite}
.si.news{border-color:var(--s-analysis);background:color-mix(in srgb,var(--s-analysis) 9%,var(--card))}
.si.news .sh{font-weight:700}
@keyframes newsglow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--s-analysis) 38%,transparent)}}
@keyframes newsdot{50%{transform:scale(1.35);opacity:.65}}
@keyframes newsb{0%,60%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(-3px) scale(1.18)}40%{transform:translateY(0) scale(1)}}
.mini{display:inline-block;border-radius:99px;padding:0 7px;font-size:10px;font-weight:800;line-height:1.7;margin-left:2px}
.mini.wait{background:#f0a63a;color:#2a1700}.mini.news{background:var(--s-analysis);color:#fff}
.stn h2 .n{margin-left:auto}
.mu{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:11px;font-weight:600;line-height:1.5;padding:1px 7px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.mu:hover{background:var(--chip);color:var(--ink)}.mu.on{background:var(--chip);color:var(--ink);border-style:dashed}
.tok.muted{--sc:var(--idle);animation:none!important;opacity:.78;background:var(--card);border-color:var(--line)}
.tok.muted::after{display:none}.tok.muted .t{font-weight:400}
.tok.muted .badge{background:var(--chip);color:var(--mute)}
/* ---- card actions: one icon-only row under a thin separator ---- */
.act{display:flex;justify-content:flex-end;align-items:center;gap:2px;margin:5px 0 0;padding-top:3px;border-top:1px solid var(--line)}
.act .ib,.act .rf,.act .mu{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--mute);cursor:pointer;text-decoration:none;font-size:14px}
.act .ib:hover,.act .rf:hover,.act .mu:hover{background:var(--chip);color:var(--ink)}
.act .rf.sent{color:var(--ok)}.act .rf.pend{opacity:.6;cursor:default}
.act .mu.on{color:var(--ink);background:var(--chip)}
header button.tg.wk-on{border-color:#2fb577}
header button.tg.wk-off{border-color:#f0a63a;color:#f0a63a;animation:ring 1.8s ease-in-out infinite}
.wkdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#2fb577}
.wk-off .wkdot{background:#f0a63a}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" id="logo"></span>Session Control</div>
  <nav><button id="tb" class="on">Live board</button><button id="tw">Week / timesheet</button></nav>
  <span id="attn"></span><span id="wx" class="pill"></span><span class="sp"></span><span class="mute" id="pets"></span><button class="tg" id="wk"></button><button class="tg" id="theme"></button><button class="tg" id="sidetg"></button><button class="tg" id="anim"></button><span class="mute" id="upd"></span>
</header>
<div class="layout"><main id="main"></main><aside id="side"></aside></div>
<dialog id="rvdlg"><form method="dialog" id="rvform">
  <h3 id="rvh3"></h3><p id="rvhint"></p>
  <input id="rvpr" inputmode="numeric" autocomplete="off">
  <div class="err" id="rverr"></div>
  <div class="acts"><button type="button" id="rvcancel">Cancel</button><button type="submit" class="go" id="rvgo"></button></div>
</form></dialog>

async function load(){

  catch(e){$('#main').innerHTML='<p>Error: '+esc(e)+'</p>'}

const STC={review_others:'var(--s-review)',analysis:'var(--s-analysis)',po:'var(--s-po)',dev:'var(--s-dev)',my_cr:'var(--s-cr)',completed:'var(--s-done)',none:'var(--s-none)'};
const STI={review_others:'eye',analysis:'search',po:'usercheck',dev:'code',my_cr:'pr',completed:'done',none:'folder'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let theme=store.get('theme')||'system';
const THEMES=['system','light','dark'];
function applyTheme(){
  const r=document.documentElement;
  if(theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);
  const b=$('#theme');if(!b)return;
  b.innerHTML=`${I(theme==='dark'?'moon':theme==='light'?'sun':'monitor',14)} ${theme==='system'?'System':theme==='light'?'Light':'Dark'}`;

let calm=store.get('calm')==='1';document.documentElement.classList.toggle('calm',calm);

const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};

/* mood of a session: icon + tone + a line of dry office humour */
function persona(x){
  const a=x.ageMin||0;let icon,tone,fx='',say;
  if(x.prState==='completed'){icon='trophy';tone='ok';fx='party';say=['Merged. Nicely done.','Shipped. A quiet victory lap is in order.','Review closed. Well played.']}
  else if(x.status==='waiting'){
    if(a<10){icon='bell';tone='wait';fx='knock1';say=['A moment of your time?','Whenever you are ready.','Standing by for your input.']}
    else if(a<30){icon='bell';tone='wait';fx='knock2';say=['Still here, patiently.','No rush. (A little rush.)','A gentle reminder that I exist.']}
    else if(a<60){icon='alert';tone='hot';fx='knock3';say=['Counting the ceiling tiles.','This is fine. Truly.','Patience is a virtue. Mine is running low.']}
    else{icon='alert';tone='hot';fx='knock3';say=['Escalating to polite concern.','Drafting a strongly worded memo.','I have prepared a slide deck on waiting.']}
  }
  else if(x.status==='busy'){icon='loader';tone='busy';fx='typing';say=['In deep focus.','Working through the details.','Making progress, quietly.']}
  else if(x.needs==='news'){icon='mail';tone='news';fx='news';say=['Fresh results, just for you.','I have news whenever you do.','New on your desk.']}
  else if(x.status==='closed'){icon='power';tone='idle';fx='sleep';say=['Offline. Back when reopened.','Resting between sessions.','Out of office.']}
  else if(a>=1440){icon='snow';tone='cold';fx='sleep';say=['Dormant, but not forgotten.','Last seen: a while ago.','Quarterly review pending.']}
  else if(a>=240){icon='moon';tone='idle';fx='sleep';say=['Taking a well-earned break.','Running in low-power mode.','Out for coffee.']}
  else if(a>=30){icon='meh';tone='idle';say=['Between tasks.','Reviewing my notes.','Taking a breather.']}
  else{icon='smile';tone='ok';say=['All systems nominal.','Everything on track.','Smooth sailing.']}
  return {icon,tone,fx,text:say[hash(x.id+':'+Math.floor(a/30))%say.length]};
}
function rfBtn(x){
  const p=x.ping;
  const lab=!p?I('refresh',14):(p.sent?I('check',14):I('hourglass',14));
  return `<button class="rf${p&&!p.sent?' pend':''}${p&&p.sent?' sent':''}" data-id="${esc(x.id)}" title="Refresh: ask this session 'Something new?'${p&&p.sent?' (asked '+p.agoMin+' min ago, click to ask again)':''}"${p&&!p.sent?' disabled':''}>${lab}</button>`;
}
const cleanName=t=>(t||'').replace(/^\[[^\]]+\]\s*(?=\d{4,6})/,'').replace(/^\/?(implement|refine)\s+\d{4,6}$/i,'$1 (starting…)').replace(/^(PR\s+\d+\s+#\d+|PR\s+\d+|Ticket\s+\d+|\/?(?:implement|refine)\s+\d{4,6}\s+|\d{4,6})\s*/i,'').replace(/^🤖\s*/,'');
const openLink=x=>`<a class="open" href="${esc(x.open)}" title="Open this session in Claude Desktop">${I('ext',11)}<span class="lbl">Open</span></a>`;
const muBtn=x=>`<button class="mu${x.muted?' on':''}" data-id="${esc(x.id)}" data-muted="${x.muted?1:0}" title="${x.muted?'Muted: not shown in To do. Click to unmute':'Mute: hide this card from To do and the counters'}">${I(x.muted?'bellOff':'bell',14)}</button>`;
const openIcon=x=>`<a class="ib" href="${esc(x.open)}" title="Open this session in Claude Desktop">${I('ext',14)}</a>`;
const actRow=x=>`<div class="act">${openIcon(x)}${x.status==='closed'?'':rfBtn(x)}${muBtn(x)}</div>`;
function tok(x,stage){
  const id=x.workItem?'#'+x.workItem:(x.pr?'PR '+x.pr:'');
  const num=x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(id)}</a>`:`<b>${esc(id)}</b>`;
  const prd=x.prState==='completed';
  const label=x.muted?'Muted':prd?'Merged':(x.status==='waiting'?'Needs you':(x.needs==='news'?'New':(SL[x.status]||x.status)));
  const ag=x.ageMin<30?'#1f9d63':x.ageMin<240?'#d99a0b':'#d64545';
  const cls=x.muted?'muted':(prd?'prdone':(x.needs==='news'&&x.status!=='waiting'?'news':x.status));
  const M=x.muted?{icon:'bellOff',tone:'idle',fx:'',text:'Muted. Staying quiet.'}:persona(x);
  const party=M.fx==='party'&&!celebrated.has(x.id);if(party)celebrated.add(x.id);
  const conf=party?`<div class="confetti">${['#5b4bc4','#0f7bb8','#c2650c','#0f7f78','#1b7a4b','#a23b72'].map((c,i)=>`<span style="left:${10+i*16}%;background:${c};animation-delay:${i*.08}s"></span>`).join('')}</div>`:'';
  return `<div class="tok ${esc(cls)} fx-${M.fx||'none'}">${conf}<div class="row"><div class="av ${M.tone}" title="Poke">${I(M.icon,16)}${M.fx==='sleep'?'<span class="zzz">z z z</span>':''}${M.fx==='typing'?'<span class="dots"><i></i><i></i><i></i></span>':''}</div>
  <div class="cont"><div class="t">${num} ${esc(cleanName(x.title))}</div><div class="bub" title="${esc(M.text)}" data-sleep="${M.fx==='sleep'?1:0}">${esc(M.text)}</div>
  <div class="m"><span class="badge">${esc(label)}</span><span class="age" style="--ag:${ag}" title="Last activity ${ago(x.ageMin)} ago${x.minutesToday?' · active today '+hmt(x.minutesToday):''}"></span>${ago(x.ageMin)}
</div>
  ${stage==='completed'?`<button class="mv ar" data-id="${esc(x.id)}" data-act="archive">${I('x',13)} Close session</button>`:''}${prd&&stage==='review_others'?(x.queued?`<button class="mv" disabled>${I('hourglass',13)} Queued</button>`:`<button class="mv" data-id="${esc(x.id)}">${I('check',13)} Move to Completed</button>`):''}</div></div>${actRow(x)}</div>`;
}
async function complete(btn){
  const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML=I('hourglass',13)+' Working…';
  try{const r=await fetch(btn.dataset.act==='archive'?'/api/archive':'/api/complete',{method:'POST',headers:{'X-Dashboard':'1','Content-Type':'application/json'},body:JSON.stringify({id:btn.dataset.id})});
    const j=await r.json();if(!j.ok)throw j.message;await load()}
  catch(e){btn.disabled=false;btn.innerHTML=orig;alert('Could not move: '+e)}
}
const RANK={waiting:0,busy:1,idle:2,closed:3};
const rk=x=>(x.muted?20:0)+(x.status==='waiting'?0:(x.needs==='news'?1:2+(RANK[x.status]??9)));
const sortS=l=>[...l].sort((a,b)=>rk(a)-rk(b));
const miniPills=l=>{const a=(l||[]).filter(x=>x.status==='waiting'&&!x.muted).length,b=(l||[]).filter(x=>x.needs==='news'&&x.status!=='waiting'&&!x.muted).length;return (a?`<span class="mini wait">${a}</span>`:'')+(b?`<span class="mini news">${b} new</span>`:'')};
const stnHead=(k,label,n,l)=>`<h2>${I(STI[k]||'folder',16)}${esc(label)}${miniPills(l)}<span class="n">${n}</span>${k==='dev'?`<button class="addrv" data-kind="implement" style="margin-left:0" title="Implement a ticket: start a new session">${I('plus',15)}</button>`:''}</h2>`;
function board(){
  const stations=S.stageOrder.filter(k=>k!=='review_others');
  const rv=sortS(S.board.review_others||[]);
  const need=rv.filter(x=>x.status==='waiting'&&!x.muted).length, merged=rv.filter(x=>x.prState==='completed').length;
  const strip=`<div class="rvlane" style="--c:${STC.review_others}"><div class="rvh">${I('eye',16)}<b>${esc(S.stageLabels.review_others)}</b><span class="n" style="margin-left:4px">${rv.length}</span>${need?`<span class="pill wait">${need} need you</span>`:''}${rv.filter(x=>x.needs==='news'&&x.status!=='waiting'&&!x.muted).length?`<span class="pill news">${rv.filter(x=>x.needs==='news'&&x.status!=='waiting'&&!x.muted).length} new</span>`:''}${merged?`<span class="pill" style="background:var(--ok);color:#fff">${merged} merged</span>`:''}<span class="hint">scroll →</span><button class="addrv" data-kind="review" title="Review a PR: start a new session">${I('plus',15)}</button></div><div class="rvrow">${rv.map(x=>tok(x,'review_others')).join('')||'<div class="empty">No reviews pending</div>'}</div></div>`;
  let h=`<div class="legend"><span><i style="background:var(--wait)"></i>Needs you</span><span><i style="background:var(--s-analysis)"></i>New results</span><span><i style="background:var(--busy)"></i>Working</span><span><i style="background:var(--idle)"></i>Idle</span><span><i style="background:var(--ok)"></i>Merged / done</span><span>Age: <span class="age" style="--ag:#1f9d63"></span> &lt;30 min &nbsp;<span class="age" style="--ag:#d99a0b"></span> &lt;4 h &nbsp;<span class="age" style="--ag:#d64545"></span> older</span></div>${strip}<div class="track">`;
  stations.forEach(k=>{
    const l=sortS(S.board[k]||[]);
    h+=`<div class="stn" style="--c:${STC[k]}">${stnHead(k,S.stageLabels[k],l.length,l)}<div class="body">${l.map(x=>tok(x,k)).join('')||'<div class="empty">—</div>'}</div></div><div class="arrow">${I('arrow',16)}</div>`;
  });
  for(const [g,l] of Object.entries(S.others))h+=`<div class="stn" style="--c:var(--s-none)">${stnHead('none',g,l.length)}<div class="body">${l.map(x=>tok(x)).join('')}</div></div><div class="arrow">${I('arrow',16)}</div>`;
  const lc=[...(S.board.completed||[])].sort((a,b)=>(a.ageMin||0)-(b.ageMin||0));
  h+=`<div class="stn" style="--c:${STC.completed}">${stnHead('completed','Completed',lc.length,lc)}<div class="body">${lc.map(x=>tok(x,'completed')).join('')||'<div class="empty">Nothing yet</div>'}</div></div></div>`;
  const nn=[...(S.board.none||[])];
  if(nn.length)h+=`<h3 class="mute" style="font-size:12px;margin:8px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">Sessions without a section · ${nn.length}</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">${nn.map(x=>tok(x)).join('')}</div>`;
  $('#main').innerHTML=h;
}
function weekView(){
  const d=S.days, names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let h=`<div class="bar"><button id="pw">${I('left',14)}</button><b>${S.weekStart} → ${S.weekEnd}</b><button id="nw">${I('right',14)}</button><button id="cp">${I('copy',14)} Copy summary</button>
  <span class="mute">Active time from transcripts (gaps over 15 min don't count). Kept after a session is deleted.</span></div>
  <div class="scroll"><table><thead><tr><th>U.S. / PR</th>${d.map((x,i)=>`<th>${names[i]}<br>${x.slice(5)}</th>`).join('')}<th>Total</th><th class="l">Path</th><th class="l">State</th></tr></thead><tbody>`;
  for(const r of S.week){
    const id=r.workItem?'#'+r.workItem:r.key;
    const nm=esc((r.title||'').replace(/^(PR \d+ #\d+|Ticket \d+|\d+)\s*/,'').slice(0,70));
    h+=`<tr><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(id)}</b></a>`:`<b>${esc(id)}</b>`} ${nm}
      ${r.kinds.includes('review')&&!r.kinds.includes('story')?'<span class="chip">review</span>':''}</td>
      ${d.map(x=>`<td>${hm(r.min[x])}</td>`).join('')}<td><b>${hmt(r.total)}</b></td>
      <td class="l">${r.stages.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</td>
      <td class="l st-${r.state}">${r.state==='open'?'Open':'Finished'}</td></tr>`;
  }
  const tot=Object.values(S.weekTotals).reduce((a,b)=>a+b,0);
  h+=`<tr class="tot"><td>Total</td>${d.map(x=>`<td>${hmt(S.weekTotals[x])}</td>`).join('')}<td>${hmt(tot)}</td><td></td><td></td></tr></tbody></table></div>`;
  $('#main').innerHTML=h;
  $('#pw').onclick=()=>{week--;load()};$('#nw').onclick=()=>{week++;load()};
  $('#cp').onclick=()=>{
    const t=S.week.map(r=>`${r.workItem?'#'+r.workItem:r.key}\t${hmt(r.total)}\t${r.title||''}`).join('\n');
    navigator.clipboard.writeText(`Week ${S.weekStart}\n`+t);$('#cp').innerHTML=I('check',14)+' Copied';
  };
}

/* ---------- to-do sidebar: only what needs an action ---------- */
function sideItems(){
  const g={need:[],news:[],merge:[],close:[]};
  const all=[];
  [...S.stageOrder,'completed','none'].forEach(k=>(S.board[k]||[]).forEach(x=>all.push([k,x])));
  for(const [k,x] of all){
    if(x.muted)continue;
    if(x.status==='waiting')g.need.push([k,x]);
    else if(k==='review_others'&&x.prState==='completed'&&!x.queued)g.merge.push([k,x]);
    else if(k==='completed')g.close.push([k,x]);
    else if(x.needs==='news')g.news.push([k,x]);
  }
  g.news.sort((p,q)=>(p[1].unreadMin||0)-(q[1].unreadMin||0));
  g.need.sort((p,q)=>(q[1].ageMin||0)-(p[1].ageMin||0));
  return g;
}
function sitem(type,x,reason,btns){
  const id=x.workItem?'#'+x.workItem:(x.pr?'PR '+x.pr:'');
  const num=x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(id)}</a>`:`<b>${esc(id)}</b>`;
  return `<div class="si ${type}"><div class="sh" title="${esc(x.title)}">${num} ${esc(cleanName(x.title))}</div><div class="sr">${reason}</div><div class="sb">${btns}${openLink(x)}</div></div>`;
}
function side(){
  const g=sideItems();sideG=g;
  const n=g.need.length+g.news.length+g.merge.length+g.close.length+(S.pending||[]).length;
  sideN=n;
  const grp=(title,items)=>items.length?`<div class="sg"><h3>${title} · ${items.length}</h3>${items.join('')}</div>`:'';
  let h=`<div class="sbox"><h2>${I('list',16)} To do <span class="cnt${n?'':' zero'}">${n||I('check',11)}</span></h2>`;
  if(!n)h+=`<div class="sempty">${I('done')}All clear — nothing needs you.</div>`;
  const pg=(S.pending||[]).map(p=>{
    const all=Object.values(S.board).flat(), x=all.find(y=>y.id===p.id)||{id:p.id,title:p.title,open:'claude://claude.ai/epitaxy/'+p.id};
    const mm=(p.title||'').match(/#(\d{4,6})/)||(p.title||'').match(/^\D*(\d{4,6})/); if(!x.workItem&&mm)x.workItem=mm[1];
    const verb=p.label||(p.action==='archive'?'Close session':'Move to Completed');
    const reason=p.approved?`${I('hourglass',12)} Claude is working on it…`:(p.error?`${I('alert',12)} ${esc(p.error)}`:esc(verb)+' · queued');
    const btn=p.approved?`<button class="mv ap" disabled>${I('hourglass',12)} Working…</button>`:`<button class="mv ap" data-apply="${esc(p.id)}" data-act="${esc(p.action)}">${I('play',11)} ${p.error?'Retry':'Do it'}</button>`;
    return sitem('claude',x,reason,btn);
  });
  h+=grp('Waiting for Claude',pg);
  h+=grp('Needs you',g.need.map(([k,x])=>sitem('need',x,`${I('bell',12)} <span>${esc(x.waitingFor||'Waiting for your answer')} · ${ago(x.ageMin)}</span>`,'')));
  h+=grp('Unread results',g.news.map(([k,x])=>sitem('news',x,`${I('mail',12)} New since you last looked · ${ago(x.unreadMin||0)}`,'')));
  h+=grp('PR merged: move to Completed',g.merge.map(([k,x])=>sitem('merge',x,'Review done, PR completed',`<button class="mv" data-id="${esc(x.id)}">${I('check',12)} Completed</button>`)));
  h+=grp('Done: close the session',g.close.map(([k,x])=>sitem('close',x,'In Completed',`<button class="mv ar" data-id="${esc(x.id)}" data-act="archive">${I('x',12)} Close</button>`)));
  $('#side').innerHTML=h+'</div>';
}

function favicon(n){
  const badge=n>0?"<circle cx='49' cy='49' r='14' fill='%23f0a63a' stroke='white' stroke-width='4'/>":'';
  const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232f6bff'/><stop offset='1' stop-color='%2314b8a6'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><g fill='white'><rect x='9' y='14' width='12' height='10' rx='3'/><rect x='9' y='27' width='12' height='10' rx='3'/><rect x='9' y='40' width='12' height='10' rx='3'/><rect x='26' y='14' width='12' height='10' rx='3'/><rect x='26' y='27' width='12' height='10' rx='3'/><rect x='43' y='14' width='12' height='10' rx='3' opacity='.9'/></g>"+badge+"</svg>";
  const l=$('#fav');const h='data:image/svg+xml,'+svg;if(l&&l.getAttribute('href')!==h)l.setAttribute('href',h);
}

function pageTitle(all,w,b,maxWait){
  const id=x=>x.workItem?'#'+x.workItem:(x.pr?'PR '+x.pr:'session');
  const wl=all.filter(x=>x.status==='waiting'&&!x.muted).sort((p,q)=>(q.ageMin||0)-(p.ageMin||0));
  const g=sideG||{need:[],news:[],merge:[],close:[]};
  const pend=S.pending||[];
  let t;
  if(w===1)t=`${id(wl[0])} needs you (${ago(wl[0].ageMin||0)})`;
  else if(w>1)t=`${w} need you · longest ${ago(maxWait)}`;
  else if(g.news.length&&g.merge.length+g.close.length+pend.length===0){
    t=g.news.length===1?`New results: ${id(g.news[0][1])}`:`${g.news.length} unread`;
  }
  else if(g.merge.length+g.close.length+pend.length===1){
    if(g.merge.length)t=`Move ${id(g.merge[0][1])} to Completed`;
    else if(g.close.length)t=`Close ${id(g.close[0][1])}`;
    else t=pend[0].approved?'Claude is working on it…':'1 request for Claude';
  }
  else if(sideN>0)t=`${sideN} actions to do`;
  else if(b>0)t=`${b} working · ${all.length} open`;
  else t=`All clear · ${all.length} open`;
  const mark=w>0?'● ':'';
  return mark+t+' | Session Control';
}
function render(){
  const all=Object.values(S.board).flat().concat(Object.values(S.others).flat());
  const live=all.filter(x=>!x.muted);const w=live.filter(x=>x.status==='waiting').length, b=all.filter(x=>x.status==='busy').length, mu=all.filter(x=>x.muted).length;
  const un=live.filter(x=>x.needs==='news'&&x.status!=='waiting').length;
  $('#attn').innerHTML=(un?`<span class="pill news">${I('mail',12)} ${un} unread</span> `:'')+(w?`<span class="pill wait">${I('bell',12)} ${w} waiting for you</span> `:'')+`<span class="pill">${I('loader',12)} ${b} working</span> <span class="pill">${all.length} open</span>`+(mu?` <span class="pill" title="Cards you muted">${I('bellOff',12)} ${mu} muted</span>`:'');
  const maxWait=Math.max(0,...live.filter(x=>x.status==='waiting').map(x=>x.ageMin||0));
  $('#wx').innerHTML=w===0?`${I('sun',14)} All clear`:(w>=3||maxWait>=60)?`${I('zap',14)} Escalation: ${w} waiting too long`:maxWait>=30?`${I('rain',14)} Heavy traffic: ${w} waiting`:`${I('cloud',14)} Light traffic: ${w} need you`;
  $('#pets').textContent=pats?`Pokes today: ${pats}`:'';
  $('#anim').textContent=calm?'Animations: off':'Animations: on';
  $('#upd').textContent='Updated '+new Date(S.now*1000).toLocaleTimeString();
  tab==='board'?board():weekView();side();favicon(sideN);document.title=pageTitle(all,w,b,maxWait);document.documentElement.classList.toggle('nosd',sideOff);
  const wk=$('#wk');wk.className='tg '+(S.worker?'wk-on':'wk-off');wk.innerHTML=`<span class="wkdot"></span> ${S.worker?'Worker running':'Start worker'}`;wk.title=S.worker?'The queue worker session is running: clicks on Refresh and Do it are processed':'No queue worker is running: clicks only queue up. Click to open a new worker session (press Enter in it)';
  const tg=$('#sidetg');tg.innerHTML=`${I('list',14)} To do <span class="cnt${sideN?'':' zero'}">${sideN||I('check',11)}</span>`;tg.classList.toggle('off',sideOff);tg.title=sideOff?'Show the to-do panel':'Hide the to-do panel';
}
$('#tb').onclick=()=>{tab='board';$('#tb').className='on';$('#tw').className='';render()};
$('#tw').onclick=()=>{tab='week';$('#tw').className='on';$('#tb').className='';render()};

const START={
  review:{icon:'eye',title:'Review a pull request',ph:'PR number, e.g. 38219',go:'Start review',section:'Peer code reviews',skill:'my-code-review',
    hint:'A new session opens in your <b>projects</b> folder and asks Claude to run the <code>my-code-review</code> skill for that PR (links can\'t start slash commands, so it is worded as a request) and to file itself under Peer code reviews.',
    msg:n=>'Use the my-code-review skill to review PR '+n+' and place this session in the "Peer code reviews" section.'},
  implement:{icon:'code',title:'Implement a ticket',ph:'Ticket number, e.g. 70101',go:'Start implementation',section:'Development',skill:'implement',
    hint:'A new session opens in your <b>projects</b> folder and asks Claude to run the <code>implement</code> skill for that ticket (links can\'t start slash commands, so it is worded as a request) and to file itself under Development.',
    msg:n=>'Use the implement skill for ticket '+n+' and place this session in the "Development" section.'}
};
let startKind='review';
function openStartDialog(kind){
  startKind=kind;const c=START[kind];
  $('#rvh3').innerHTML=I(c.icon,16)+' '+c.title;$('#rvhint').innerHTML=c.hint;$('#rvpr').placeholder=c.ph;
  $('#rvgo').innerHTML=I('play',12)+' '+c.go;
  $('#rverr').textContent='';$('#rvpr').value='';
  $('#rvdlg').showModal();setTimeout(()=>$('#rvpr').focus(),30);
}
async function startReview(ev){
  ev.preventDefault();const c=START[startKind];
  const n=$('#rvpr').value.replace(/^\s*#?/,'').trim();
  if(!/^\d{1,7}$/.test(n)){$('#rverr').textContent='Enter the number (digits only).';return}
  try{
    const r=await fetch('/api/review',{method:'POST',headers:{'X-Dashboard':'1','Content-Type':'application/json'},body:JSON.stringify({kind:startKind,n})});
    const j=await r.json();if(!j.ok)throw j.message;
  }catch(e){$('#rverr').textContent='Could not register: '+e;return}
  const url='claude://code/new?folder='+encodeURIComponent(S.projectsDir||'')+'&q='+encodeURIComponent(c.msg(n));
  const a=document.createElement('a');a.href=url;document.body.appendChild(a);a.click();a.remove();
  $('#rvdlg').close();
}
$('#rvform').addEventListener('submit',startReview);
$('#rvcancel').onclick=()=>$('#rvdlg').close();
document.addEventListener('click',async e=>{
  const mb=e.target.closest('.mu');
  if(mb){try{await fetch('/api/mute',{method:'POST',headers:{'X-Dashboard':'1','Content-Type':'application/json'},body:JSON.stringify({id:mb.dataset.id,muted:mb.dataset.muted!=='1'})});await load()}catch(err){alert('Could not save: '+err)}return}
  const add=e.target.closest('.addrv[data-kind]');if(add){openStartDialog(add.dataset.kind);return}
  const ap=e.target.closest('.ap[data-apply]');
  if(ap&&!ap.disabled){const o=ap.innerHTML;ap.disabled=true;ap.innerHTML=I('hourglass',12)+' Working…';
    try{const r=await fetch('/api/apply',{method:'POST',headers:{'X-Dashboard':'1','Content-Type':'application/json'},body:JSON.stringify({id:ap.dataset.apply,action:ap.dataset.act})});const j=await r.json();if(!j.ok)throw j.message;await load()}
    catch(err){ap.disabled=false;ap.innerHTML=o;alert('Could not send: '+err)}
    return}
  const rf=e.target.closest('.rf');
  if(rf&&!rf.disabled){const o=rf.innerHTML;rf.disabled=true;rf.innerHTML=I('hourglass',12);
    try{const r=await fetch('/api/ping',{method:'POST',headers:{'X-Dashboard':'1','Content-Type':'application/json'},body:JSON.stringify({id:rf.dataset.id})});const j=await r.json();if(!j.ok)throw j.message;await load()}
    catch(err){rf.disabled=false;rf.innerHTML=o;alert('Could not queue: '+err)}
    return}
  if(e.target.closest('#theme')){theme=THEMES[(THEMES.indexOf(theme)+1)%3];store.set('theme',theme);applyTheme();return}
  if(e.target.closest('#wk')){
    if(S.worker){alert('The queue worker is already running.');return}
    const url='claude://code/new?folder='+encodeURIComponent(S.homeDir||'')+'&q='+encodeURIComponent(S.workerPrompt||'');
    const a=document.createElement('a');a.href=url;document.body.appendChild(a);a.click();a.remove();return}
  if(e.target.closest('#sidetg')){sideOff=!sideOff;store.set('sideoff',sideOff?'1':'0');render();return}
  if(e.target.closest('#anim')){calm=!calm;store.set('calm',calm?'1':'0');document.documentElement.classList.toggle('calm',calm);render();return}
  const pt=e.target.closest('.av');
  if(pt){pats++;store.set('pats',String(pats));$('#pets').textContent='Pokes today: '+pats;
    pt.classList.remove('pat');void pt.offsetWidth;pt.classList.add('pat');
    const hs=document.createElement('span');hs.className='heart';hs.textContent='+1';pt.appendChild(hs);setTimeout(()=>hs.remove(),1000);
    const bub=pt.closest('.tok')?.querySelector('.bub');
    if(bub&&bub.dataset.sleep==='1')bub.textContent='Oh, hello. I was only resting my eyes.';
    return}
  const b=e.target.closest('.mv');if(b&&!b.disabled)complete(b)});
load();setInterval(load,10000);
</script>
